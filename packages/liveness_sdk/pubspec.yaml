name: liveness_sdk
description: "Reusable face liveness detection module (camera + ML Kit face detection)."
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.8.1
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2
dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
